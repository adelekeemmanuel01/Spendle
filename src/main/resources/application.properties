# Spendle

# ── Database (Supabase PostgreSQL) ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.kkafggtqncutzzmqapxr
# Set the DB_PASSWORD environment variable before running the app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ── JWT ────────────────────────────────────────────────────────────────────────
# REQUIRED: Set JWT_SECRET in your environment (min 32 ASCII chars = 256 bits for HS256).
# Example (PowerShell):  $env:JWT_SECRET="change-me-to-a-long-random-secret-value-here"
# NEVER commit a real secret to git.
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-value-here-256bits}
# Token lifetime in milliseconds (default: 24 hours = 86400000 ms)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ───────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins.
# Add your production domain (e.g. https://app.spendle.com) via environment variable.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}